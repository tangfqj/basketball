# Default run configuration. CLI flags override these values.
rules: 3x3                 # 5v5 | 3x3 (requirements §5.5)
court_standard: fiba_3x3   # nba | fiba | fiba_3x3 (ncaa, high_school: TODO)

video:
  proxy_height: 1080       # working-copy resolution for full-frame models
  keep_full_res_rim_roi: true

evaluation:
  match_tolerance_s: 1.0   # requirements §7.3

cache_dir: cache           # per-video intermediate results (git-ignored)
