[project]
name = "hoopstats"
version = "0.1.0"
description = "Shot statistics from fixed-camera basketball video (Milestone 1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed in Phase 2 (detector framework still to be decided, see doc/plan.md)
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
]

[project.scripts]
hoopstats = "hoopstats.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoopstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
