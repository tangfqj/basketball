<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hoopstats · calibration</title>
<style>
  :root { --bg:#16181d; --panel:#1f2229; --line:#2e323b; --fg:#e6e8ec; --mute:#8b919c; --ok:#3ecf8e; --bad:#ff6b6b; --sel:#2b3a55; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system, system-ui, sans-serif;
         display:grid; grid-template-columns:1fr 340px; height:100vh; }
  main { position:relative; min-width:0; padding:12px; display:flex; flex-direction:column; gap:8px; }
  #wrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas#c { max-width:100%; max-height:100%; cursor:crosshair; border-radius:6px; }
  aside { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  section { padding:12px; border-bottom:1px solid var(--line); }
  h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); }
  #loupe { width:100%; aspect-ratio:1; background:#000; border-radius:4px; }
  #list { overflow:auto; flex:1; padding:0; }
  .item { padding:5px 12px; display:flex; justify-content:space-between; cursor:pointer; border-bottom:1px solid var(--line); }
  .item.sel { background:var(--sel); } .set { color:var(--ok); } .unset { color:var(--mute); }
  .rim { color:#ffd84d; }
  button { background:var(--ok); color:#000; border:0; border-radius:4px; padding:8px 14px; font-weight:600; cursor:pointer; }
  .bar { color:var(--mute); display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .bar b { color:var(--fg); }
  small { color:var(--mute); }
</style>
</head>
<body>
<main>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div class="bar">
    <span>court points <b id="nc">0</b> (need ≥ 4)</span>
    <span>rim points <b id="nr">0</b> / 4</span>
    <span>fit error <b id="err">–</b></span>
    <span id="status"></span>
    <button id="save">Save</button>
  </div>
</main>
<aside>
  <section>
    <h2>Zoom</h2>
    <canvas id="loupe" width="280" height="280"></canvas>
    <small>Select an item below, then click its position in the image (the zoom box helps). ⌫ clears the selected
      point. <b>Red lines</b> = court model, <b>yellow oval</b> = rim: both should sit on what you see in the image.</small>
  </section>
  <section id="list"></section>
</aside>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const loupe = document.getElementById('loupe'), lg = loupe.getContext('2d');
const img = new Image();
let init, names = [], points = {}, sel = null, lines = [], mouse = null;

async function start() {
  init = await (await fetch('/api/init')).json();
  names = [...init.rim_points, ...init.landmarks.map(l => l.name)];
  points = init.points || {};
  sel = names.find(n => !points[n]) || names[0];
  img.onload = () => { c.width = img.naturalWidth; c.height = img.naturalHeight; renderList(); preview(); };
  img.src = '/frame.jpg';
  document.title = `calibrate · ${init.video}`;
}

const PLAIN = {
  rim_left: 'Rim — left end of the orange ring',
  rim_right: 'Rim — right end of the orange ring',
  rim_front: 'Rim — near side (lower edge of the oval, closest to the camera)',
  rim_back: 'Rim — far side (upper edge of the oval, next to the backboard)',
  baseline_left_corner: 'Court — left corner of the end line under the basket',
  baseline_right_corner: 'Court — right corner of the end line under the basket',
  corner3_left_baseline: 'Court — where the big arc meets the end line (left)',
  corner3_right_baseline: 'Court — where the big arc meets the end line (right)',
  lane_left_baseline: 'Court — left corner of the painted box under the basket',
  lane_right_baseline: 'Court — right corner of the painted box under the basket',
  ft_line_left: 'Court — far-from-basket left corner of the painted box',
  ft_line_right: 'Court — far-from-basket right corner of the painted box',
  arc_top: 'Court — top (middle) of the big arc',
  top_left_corner: 'Court — left corner of the court edge nearest the camera',
  top_right_corner: 'Court — right corner of the court edge nearest the camera',
};
const label = n => PLAIN[n] || (n.startsWith('trackid_') ? 'Court corner (from the dataset)' : n.replaceAll('_', ' '));
let showCourt = null;

function renderList() {
  const el = document.getElementById('list'); el.innerHTML = '';
  const courtSet = Object.keys(points).filter(k => !init.rim_points.includes(k) && points[k]).length;
  if (showCourt === null) showCourt = courtSet < 4;
  const addItem = n => {
    const d = document.createElement('div');
    d.className = 'item' + (n === sel ? ' sel' : '');
    const rim = init.rim_points.includes(n);
    d.innerHTML = `<span class="${rim ? 'rim' : ''}">${label(n)}</span><span class="${points[n] ? 'set' : 'unset'}">${points[n] ? '●' : '○'}</span>`;
    d.onclick = () => { sel = n; renderList(); draw(); };
    el.appendChild(d);
  };
  init.rim_points.forEach(addItem);
  const hdr = document.createElement('div');
  hdr.className = 'item';
  hdr.innerHTML = courtSet >= 4
    ? `<span class="set">Court: ${courtSet} points already set — nothing to do if the red lines sit on the painted lines</span><span>${showCourt ? '▾' : '▸'}</span>`
    : `<span>Court: click at least 4 of these (${courtSet} set)</span><span>${showCourt ? '▾' : '▸'}</span>`;
  hdr.onclick = () => { showCourt = !showCourt; renderList(); };
  el.appendChild(hdr);
  if (showCourt) names.filter(n => !init.rim_points.includes(n)).forEach(addItem);
  document.getElementById('nc').textContent = courtSet;
  document.getElementById('nr').textContent = init.rim_points.filter(k => points[k]).length;
}

function draw() {
  g.drawImage(img, 0, 0);
  const lw = Math.max(2, c.width / 1000);
  g.lineWidth = lw; g.strokeStyle = 'rgba(255,60,60,0.9)';
  lines.forEach(ln => { g.beginPath(); ln.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); });
  const r = init.rim_points.map(n => points[n]);
  if (r[0] && r[1]) {  // rim ellipse from left/right (+ front/back)
    const cx = (r[0][0] + r[1][0]) / 2, rx = Math.abs(r[1][0] - r[0][0]) / 2;
    const cy = r[2] && r[3] ? (r[2][1] + r[3][1]) / 2 : (r[0][1] + r[1][1]) / 2;
    const ry = r[2] && r[3] ? Math.abs(r[2][1] - r[3][1]) / 2 : rx * 0.25;
    g.strokeStyle = '#ffd84d'; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI); g.stroke();
  }
  for (const [n, p] of Object.entries(points)) {
    if (!p) continue;
    g.fillStyle = n === sel ? '#fff' : init.rim_points.includes(n) ? '#ffd84d' : '#3ecf8e';
    g.beginPath(); g.arc(p[0], p[1], lw * 3, 0, 2 * Math.PI); g.fill();
  }
  drawLoupe();
}

function drawLoupe() {
  lg.fillStyle = '#000'; lg.fillRect(0, 0, loupe.width, loupe.height);
  const p = mouse || (sel && points[sel]);
  if (!p) return;
  const z = 6, s = loupe.width / z;  // source window size in image px
  lg.imageSmoothingEnabled = false;
  lg.drawImage(c, p[0] - s / 2, p[1] - s / 2, s, s, 0, 0, loupe.width, loupe.height);
  lg.strokeStyle = '#fff'; lg.lineWidth = 1;
  lg.beginPath(); lg.moveTo(loupe.width / 2, 0); lg.lineTo(loupe.width / 2, loupe.height);
  lg.moveTo(0, loupe.height / 2); lg.lineTo(loupe.width, loupe.height / 2); lg.stroke();
}

function toImage(ev) {
  const r = c.getBoundingClientRect();
  return [(ev.clientX - r.left) / r.width * c.width, (ev.clientY - r.top) / r.height * c.height];
}
c.addEventListener('mousemove', ev => { mouse = toImage(ev); drawLoupe(); });
c.addEventListener('mouseleave', () => { mouse = null; drawLoupe(); });
c.addEventListener('click', ev => {
  if (!sel) return;
  points[sel] = toImage(ev).map(v => Math.round(v * 10) / 10);
  const i = names.indexOf(sel);
  sel = names.slice(i + 1).find(n => !points[n]) || sel;
  renderList(); preview();
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Backspace' || ev.key === 'Delete') && sel) { delete points[sel]; renderList(); preview(); ev.preventDefault(); }
  if (ev.key === 's' && (ev.metaKey || ev.ctrlKey)) { save(); ev.preventDefault(); }
});

async function preview() {
  const r = await (await fetch('/api/preview', {method: 'POST', body: JSON.stringify({points})})).json();
  lines = r.lines;
  document.getElementById('err').textContent = r.error_m == null ? '–' : (r.error_m * 100).toFixed(1) + ' cm';
  draw();
}
async function save() {
  const r = await fetch('/api/save', {method: 'POST', body: JSON.stringify({points})});
  const d = await r.json();
  const s = document.getElementById('status');
  s.textContent = d.ok ? `saved → ${d.path}` : `not saved: ${d.error}`;
  s.style.color = d.ok ? 'var(--ok)' : 'var(--bad)';
}
document.getElementById('save').onclick = save;
start();
</script>
</body>
</html>
